spring.application.name=libri

# --- Porta ---
# La 8080 è del gateway (unico punto di ingresso): libri sta sulla 8081
server.port=8081

# --- Database / JPA ---
# Le tabelle le crea Flyway: Hibernate controlla solo che le entita corrispondano
spring.jpa.hibernate.ddl-auto=validate
# Niente query al database fuori dalle transazioni (toglie anche il WARN nel log)
spring.jpa.open-in-view=false

# --- Caricamento dei PDF ---
# Di default Spring accetta file fino a 1 MB: per un libro serve di piu
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB