spring.application.name=libri

# --- Porta ---
# La 8080 è del gateway (unico punto di ingresso): libri sta sulla 8081
server.port=8081

# --- Database / JPA ---
# Le tabelle le crea Flyway: Hibernate controlla solo che le entita corrispondano
spring.jpa.hibernate.ddl-auto=validate
# Niente query al database fuori dalle transazioni (toglie anche il WARN nel log)
spring.jpa.open-in-view=false

# --- Caricamento dei PDF ---
# Di default Spring accetta file fino a 1 MB: per un libro serve di piu
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- RabbitMQ: le frasi da preparare in anticipo ---
# Container Docker eco-rabbitmq (pannello su http://localhost:15672)
# 127.0.0.1 e non localhost: come per Piper, su Windows localhost prova prima IPv6
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Dove libri manda le frasi: l'exchange e l'etichetta (routing key)
# La coda la crea voce, che e' chi la legge
eco.preparazione.exchange=eco.voce
eco.preparazione.routing-key=prepara
# Quante pagine dopo quella aperta preparare
eco.preparazione.pagine-avanti=1