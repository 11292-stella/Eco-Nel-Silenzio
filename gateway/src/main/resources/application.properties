spring.application.name=gateway

# --- Porta ---
# Il gateway è l'unico punto di ingresso: sta sulla 8080
server.port=8080

# --- Rotte ---
# Tutto quello che arriva su /api/libri/** va al servizio libri
spring.cloud.gateway.server.webflux.routes[0].id=libri
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/libri/**

# Tutto quello che arriva su /api/voce/** va al servizio voce
spring.cloud.gateway.server.webflux.routes[1].id=voce
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/voce/**
