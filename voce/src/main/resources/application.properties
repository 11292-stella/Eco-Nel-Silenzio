spring.application.name=voce

# --- Porta ---
# gateway 8080, libri 8081, voce 8082
server.port=8082

# --- Piper: la sintesi vocale ---
# Piper resta sempre acceso con il suo server HTTP: il modello si carica una volta sola.
# Si avvia dalla cartella voce con:
#   python -m piper.http_server -m voci/it_IT-riccardo-x_low.onnx --port 5050
# 127.0.0.1 e non localhost: con localhost Windows prova prima IPv6 e perde 2 secondi
voce.piper.url=http://127.0.0.1:5050/synthesize
# 1.1 = un po' piu' lento, da racconto
voce.piper.length-scale=1.1
# 0.5 = voce piu' regolare, meno metallica
voce.piper.noise-scale=0.5

# --- ffmpeg: abbassa la voce e converte in mp3 ---
voce.ffmpeg.comando=ffmpeg
# 0.92 = la tonalita' scelta per Riccardo: calda ma non troppo cupa
voce.ffmpeg.tonalita=0.92
# la qualita' audio della voce x_low (campioni al secondo)
voce.ffmpeg.frequenza=16000

# --- Dove salvare i file audio generati ---
voce.audio.cartella=audio